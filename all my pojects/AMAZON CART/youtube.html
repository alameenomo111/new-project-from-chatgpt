<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .amazon{
            color: rgb(0, 115, 133) ;
            text-decoration: underline;
        }
        .amount{
            color: rgb(0, 118, 0);
        }
        .cart{
            background-color: rgb(255, 216, 20);
            border: none;
            width: 100px;
            height: 25px;
            border-radius: 50px;
        }
        .buy{
            background-color: rgb(255, 164, 28);
            border: none;
            height: 25px;
            width: 100px;
            border-radius: 50px;
            margin: left 3px; ;

        }


    </style>
</head>
<body>
    <p class="amazon">Back to Amazon</p>
    
    <h3>Nike Black Running Shoes</h3>
    <p class="amount">$39-in stock</p>
    <p>free delivery tomorrow.</p>
    <button class="cart">Add to cart</button>
    <button class="buy">Buy now

    </button>
    
</body>
</html>
