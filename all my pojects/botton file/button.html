<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .subscribe{
            background-color: rgb(200, 0, 0);
            border: none;
            color: white;
            padding-top:10px ;
            padding-bottom: 10px;
            padding-left: 16px;
            padding-right: 16px;
            border-radius: 2px;
            margin-right: 8px;
            cursor: pointer;
            transition:opacity 0.8s ;
            vertical-align: top;
        }
        .subscribe:hover{
            opacity: 0.7;
        }
        .subscribe:active{
             opacity: 0.3;
        }
        .join{
            background-color: white;
            border-color:rgb(41, 118, 211) ;
            color:rgb(41, 118, 211) ; 
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 9px;
            padding-bottom: 9px;
            border-radius: 3px;
            cursor: pointer;
            border-style: solid;
            border-width: 1.5px;
            transition: background-color 0.8s,color 0.8s;

            
        }
        .join:hover{
            background-color: rgb(2, 137, 255) ;
            color: white;
        }
        .join:active{
            opacity: 0.4;
        }
        .tweet{
            background-color:rgb(2, 137, 255) ;
            border: none;
           
            border-radius: 40px;
            margin-left: 7px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            vertical-align: top;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 11px;
            padding-bottom: 11px;

        }
        .tweet:hover{
            box-shadow: rgba(0, 0,0,3 ) 10px 10px 10px;
            transition: box-shadow 0.8s;
        }
    </style>
  </head>
  <body>
    <button class="subscribe">SUBSCRIBE</button>
    <button class="join">JOIN </button>
    <button class="tweet">Tweet</button>
  </body>
</html>
